name: Build cTrader indicator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore src/GPT-ZONESindicator/GPT-ZONESindicator.csproj

      - name: Build
        run: dotnet build src/GPT-ZONESindicator/GPT-ZONESindicator.csproj --configuration Release --no-restore
