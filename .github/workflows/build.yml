name: Build cTrader indicator

on:
  pull_request:
    branches: [main, "phase-*/**"]
  push:
    branches: [main, "feature/**", "phase-*/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore GPT-ZONESindicator.csproj

      - name: Build
        run: dotnet build GPT-ZONESindicator.csproj --configuration Release --no-restore

      - name: Verify packaged algo artifact
        shell: bash
        run: |
          test -f bin/Release/net6.0/GPT-ZONESindicator.algo
          ls -lh bin/Release/net6.0/GPT-ZONESindicator.algo

      - name: Verify artifact name normalization
        shell: bash
        run: |
          # Simulate cTrader.Automate producing a parent-folder-named artifact such as GPT.algo.
          cp bin/Release/net6.0/GPT-ZONESindicator.algo bin/Release/net6.0/GPT.algo
          dotnet msbuild GPT-ZONESindicator.csproj -target:NormalizeCTraderArtifactName -property:Configuration=Release
          test -f bin/Release/net6.0/GPT-ZONESindicator.algo
          test ! -e bin/Release/net6.0/GPT.algo
          published="$(find "$HOME" -type f -path '*/cAlgo/Sources/Indicators/GPT-ZONESindicator.algo' -print -quit)"
          test -n "$published"
          echo "Published artifact: $published"
          ls -lh bin/Release/net6.0/GPT-ZONESindicator.algo

      - name: Run deterministic algorithm regression tests
        run: dotnet run --project tests/ZoneIntervalIndexSmoke/ZoneIntervalIndexSmoke.csproj --configuration Release
