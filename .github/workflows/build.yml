name: Build cTrader indicator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "phase-*/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore GPT-ZONESindicator.csproj

      - name: Build
        run: dotnet build GPT-ZONESindicator.csproj --configuration Release --no-restore

      - name: Verify packaged algo artifact
        shell: bash
        run: |
          test -f bin/Release/net6.0/GPT-ZONESindicator.algo
          ls -lh bin/Release/net6.0/GPT-ZONESindicator.algo
